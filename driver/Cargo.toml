[package]
name = "driver"
version = "8.4.0"
edition = "2024"
authors = ["MoriokaReimen <menschenjager.mark.neun@gmail.com>"]
description = "Personal task management application."
license = "Apache-2.0"
repository = "https://github.com/MoriokaReimen/task-fighter"
readme = "README.md"
keywords = ["todo", "task-manager", "egui", "duckdb", "productivity", "desktop-app"]
categories = ["gui", "productivity"]
publish = false

[dependencies]
domain = {path = "../domain"}
tracing.workspace = true
anyhow.workspace = true
jiff.workspace = true
image = "^0.25"
tempfile = "3.27.0"
serde = { version = "^1.0", features = ["derive"] }
toml = "^1.1"
duckdb = { version = "1.10504.0", features = ["bundled"] }
pulldown-cmark = { version = "^0.13", default-features = false, features = ["html"] }
plotters = "0.3.7"
base64 = "0.22.1"
syntect = "5.3.0"
open = "5.3.6"
minijinja = "2.21.0"
dirs = "6.0.0"

[dev-dependencies]
domain = { path = "../domain", features = ["test-util"] }

[lints]
workspace = true
