[package]
name = "utility"
version = "8.2.0"
edition = "2024"
authors = ["MoriokaReimen <menschenjager.mark.neun@gmail.com>"]
description = "Personal task management application."
license = "Apache-2.0"
repository = "https://github.com/MoriokaReimen/task-fighter"
readme = "README.md"
keywords = ["todo", "task-manager", "egui", "duckdb", "productivity", "desktop-app"]
categories = ["gui", "productivity"]
publish = false

[dependencies]
driver = {path = "../driver"}
tracing.workspace = true
anyhow.workspace = true
jiff.workspace = true
duckdb = { version = "1.10504.0", features = ["bundled"] }
rand = "0.10.2"
domain = { path = "../domain", features = ["test-util"] }

[lints]
workspace = true
