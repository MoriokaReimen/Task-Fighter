[package]
name = "task-fighter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
eframe = "0.34.3"
egui = "0.34.3"
open = "5.3.5"
regex = "1.12.4"
urlencoding = "2.1.3"
rusqlite = { version = "^0.40", features = ["bundled", "jiff"] }
tokio = { version = "^1.0", features = ["full"] }
egui_extras = { version = "^0.34", features = ["datepicker"] }
jiff = "^0.2"
tracing = "^0.1"
tracing-subscriber = "^0.3"
image = "^0.25"

[build-dependencies]
fs_extra = "1.3.0"
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
