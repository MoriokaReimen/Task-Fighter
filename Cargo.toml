[package]
name = "task-fighter"
version = "6.0.0"
edition = "2024"
authors = ["MoriokaReimen <menschenjager.mark.neun@gmail.com>"]
description = "Personal task management application."
license = "Apache-2.0"
repository = "https://github.com/MoriokaReimen/task-fighter"
readme = "README.md"
keywords = ["todo", "task-manager", "egui", "duckdb", "productivity", "desktop-app"]
categories = ["gui", "productivity"]

[dependencies]
anyhow = "1.0.102"
eframe = "0.34.3"
egui = "0.34.3"
open = "5.3.5"
regex = "1.12.4"
tokio = { version = "^1.0", features = ["full"] }
egui_extras = { version = "^0.34", features = ["datepicker"] }
jiff = { version = "^0.2", features = ["serde"] }
tracing = "^0.1"
tracing-subscriber = "^0.3"
image = "^0.25"
rand = "0.10.1"
tempfile = "3.27.0"
serde = { version = "^1.0", features = ["derive"] }
toml = "^1.1"
duckdb = { version = "^1.10504", features = ["bundled"] }

[build-dependencies]
fs_extra = "1.3.0"
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
