[package]
name = "main"
version = "7.0.22"
edition = "2024"
authors = ["MoriokaReimen <menschenjager.mark.neun@gmail.com>"]
description = "Personal task management application."
license = "Apache-2.0"
repository = "https://github.com/MoriokaReimen/task-fighter"
readme = "README.md"
keywords = ["todo", "task-manager", "egui", "duckdb", "productivity", "desktop-app"]
categories = ["gui", "productivity"]
publish = false

[dependencies]
app = {path = "../app"}
tracing.workspace = true
anyhow.workspace = true
tracing-subscriber = "^0.3"

[build-dependencies]
fs_extra = "1.3.0"
winres = "0.1.12"

[build]
rustc-wrapper = "sccache"

[[bin]]
name = "task-fighter"
path = "src/main.rs"
