[package]
name = "main"
version = "8.2.3"
edition = "2024"
authors = ["MoriokaReimen <menschenjager.mark.neun@gmail.com>"]
description = "Personal task management application."
license = "Apache-2.0"
repository = "https://github.com/MoriokaReimen/task-fighter"
readme = "../README.md"
keywords = ["todo", "task-manager", "egui", "duckdb", "productivity", "desktop-app"]
categories = ["gui", "productivity"]
publish = false

[dependencies]
app = {path = "../app"}
tracing.workspace = true
anyhow.workspace = true
tracing-subscriber = "^0.3"

[build-dependencies]
fs_extra = "1.3.0"
winres = "0.1.12"

[[bin]]
name = "task-fighter"
path = "src/main.rs"

[lints]
workspace = true

[package.metadata.deb]
name = "task-fighter"
maintainer = "MoriokaReimen <menschenjager.mark.neun@gmail.com>"
copyright = "2026 MoriokaReimen"
license-file = "../LICENSE"
extended-description = "Personal task management software with simple UI."
maintainer-scripts = "debian"
section = "utils"
priority = "optional"
assets = [
    ["target/release/task-fighter", "usr/bin/task-fighter", "755"],
    ["debian/task-fighter.desktop", "usr/share/applications/", "644"],
    ["debian/task-fighter.png", "usr/share/pixmaps/", "644"]
]

