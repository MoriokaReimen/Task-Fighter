name: release

# Only do the release on x.y.z tags.
on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"

# We need this to be able to create releases.
permissions:
  contents: write

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the release version from the tag
        if: env.VERSION == ''
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Show the version
        run: |
          echo "version is: $VERSION"
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $VERSION --draft --verify-tag --title $VERSION
    outputs:
      version: ${{ env.VERSION }}

  build:
      name: Build for ${{ matrix.TARGET }}
      needs: create-release
      runs-on: ${{ matrix.os }}
      permissions:
        contents: write
      strategy:
        fail-fast: false
        matrix:
          include:
            - os: macos-latest
              TARGET: aarch64-apple-darwin
              id: build_macos_arm
            - os: macos-latest
              TARGET: x86_64-apple-darwin
              id: build_macos_intel
            - os: ubuntu-latest
              TARGET: aarch64-unknown-linux-gnu
              id: build_linux_arm
              PKG_CONFIG_ALLOW_CROSS: "1"
            - os: ubuntu-latest
              TARGET: armv7-unknown-linux-gnueabihf
              id: build_linux_armv7
              PKG_CONFIG_ALLOW_CROSS: "1"
            - os: ubuntu-latest
              TARGET: x86_64-unknown-linux-gnu
              id: build_linux_x86
            - os: windows-latest
              TARGET: x86_64-pc-windows-msvc
              EXTENSION: .exe
              id: build_windows
            - os: windows-latest
              TARGET: i686-pc-windows-msvc
              EXTENSION: .exe
              id: build_windows

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Rust toolchain
          uses: dtolnay/rust-toolchain@stable
          with:
            targets: ${{ matrix.TARGET }}

        - name: Rust Cache
          uses: Swatinem/rust-cache@v2
          with:
            key: ${{ matrix.TARGET }}

        - name: Install Cross
          if: contains(matrix.TARGET, 'linux')
          run: cargo install cross --git https://github.com/cross-rs/cross

        - name: Install cargo-deb
          if: contains(matrix.TARGET, 'linux')
          shell: bash
          run: cargo install cargo-deb

        - name: Build debian package with cross
          if: contains(matrix.TARGET, 'linux')
          shell: bash
          env:
            CROSS_CONTAINER_ENV_PASS: "RUSTFLAGS FONTCONFIG_SYS_STATIC FREETYPE_SYS_STATIC DUCKDB_NO_PKG_CONFIG"
            DUCKDB_NO_PKG_CONFIG: "1"
            FONTCONFIG_SYS_STATIC: "1"
            FREETYPE_SYS_STATIC: "1"
            PKG_CONFIG_ALLOW_CROSS: ${{ matrix.PKG_CONFIG_ALLOW_CROSS }}
            RUSTFLAGS: "-C link-arg=-latomic -C link-arg=-lfontconfig"
          run: |
            cross build --verbose --release --target=${{ matrix.TARGET }}
            cargo deb --verbose --target ${{ matrix.TARGET }} --no-build

        - name: Cargo Build
          if: "!contains(matrix.TARGET, 'linux')"
          shell: bash
          run: |
            if [ "${{ contains(matrix.TARGET, 'linux') }}" = "true" ]; then
              cross build --verbose --release --target=${{ matrix.TARGET }}
            else
              cargo build --verbose --release --target=${{ matrix.TARGET }}
            fi

        - name: Determine archive name
          shell: bash
          run: |
            version="${{ needs.create-release.outputs.version }}"
            echo "ARCHIVE=task-fighter-$version-${{ matrix.TARGET }}" >> $GITHUB_ENV
            echo "BIN=target/${{ matrix.TARGET }}/release/task-fighter${{ matrix.EXTENSION }}" >> $GITHUB_ENV

        - name: Creating directory for archive
          shell: bash
          run: |
            mkdir -p "$ARCHIVE"/doc
            cp "$BIN" "$ARCHIVE"/
            cp README.md LICENSE "$ARCHIVE"/ || true
            if [ -d "doc" ]; then cp doc/*.png "$ARCHIVE"/doc/ || true; fi

        - name: Build archive (Windows)
          shell: bash
          if: startsWith(matrix.os, 'windows')
          run: |
            7z a "$ARCHIVE.zip" "$ARCHIVE"
            certutil -hashfile "$ARCHIVE.zip" SHA256 > "$ARCHIVE.sha256"
            echo "ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
            echo "ASSET_SUM=$ARCHIVE.sha256" >> $GITHUB_ENV

        - name: Build archive (Unix)
          shell: bash
          if: "!startsWith(matrix.os, 'windows')"
          run: |
            tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
            shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.sha256"
            echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
            echo "ASSET_SUM=$ARCHIVE.sha256" >> $GITHUB_ENV

        - name: Upload release archive
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          shell: bash
          run: |
            version="${{ needs.create-release.outputs.version }}"
            gh release upload "$version" ${{ env.ASSET }} ${{ env.ASSET_SUM }} --clobber

        - name: Find deb file
          if: contains(matrix.TARGET, 'linux')
          run: |
            DEB_PATH=$(ls target/${{ matrix.TARGET }}/debian/*.deb)
            echo "DEB_PATH=$DEB_PATH" >> $GITHUB_ENV
            echo "Found deb package at: $DEB_PATH"

        - name: Upload debian packages
          if: contains(matrix.TARGET, 'linux')
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          shell: bash
          run: |
            version="${{ needs.create-release.outputs.version }}"
            gh release upload "$version" ${{ env.DEB_PATH }} --clobber
