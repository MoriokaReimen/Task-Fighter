name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      build_macos_arm:
        type: boolean
        description: "Build: aarch64-apple-darwin (macOS ARM)"
        default: false
      build_macos_intel:
        type: boolean
        description: "Build: x86_64-apple-darwin (macOS Intel)"
        default: false
      build_linux_arm:
        type: boolean
        description: "Build: arm-unknown-linux-gnueabihf"
        default: false
      build_linux_armv7:
        type: boolean
        description: "Build: armv7-unknown-linux-gnueabihf"
        default: false
      build_linux_x86:
        type: boolean
        description: "Build: x86_64-unknown-linux-gnu"
        default: false
      build_windows:
        type: boolean
        description: "Build: x86_64-pc-windows-msvc"
        default: false

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.set-version.outputs.VERSION }}
      # マトリックス動的生成用のフィルター出力を追加
      build_macos_arm: ${{ github.event.inputs.build_macos_arm }}
      build_macos_intel: ${{ github.event.inputs.build_macos_intel }}
      build_linux_arm: ${{ github.event.inputs.build_linux_arm }}
      build_linux_armv7: ${{ github.event.inputs.build_linux_armv7 }}
      build_linux_x86: ${{ github.event.inputs.build_linux_x86 }}
      build_windows: ${{ github.event.inputs.build_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: set-version
        run: |
          VERSION="Manual-Build-$(TZ='Asia/Tokyo' date +'%Y%m%d-%H%M%S')"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $VERSION \
            --target main \
            --draft \
            --title $VERSION \
            --notes "Manual test release from main branch."
  build:
      name: Build for ${{ matrix.TARGET }}
      needs: create-release
      runs-on: ${{ matrix.os }}
      permissions:
        contents: write
      strategy:
        fail-fast: false
        matrix:
          include:
            - os: macos-latest
              TARGET: aarch64-apple-darwin
              id: build_macos_arm
            - os: macos-latest
              TARGET: x86_64-apple-darwin
              id: build_macos_intel
            - os: ubuntu-latest
              TARGET: arm-unknown-linux-gnueabihf
              id: build_linux_arm
            - os: ubuntu-latest
              TARGET: armv7-unknown-linux-gnueabihf
              id: build_linux_armv7
            - os: ubuntu-latest
              TARGET: x86_64-unknown-linux-gnu
              id: build_linux_x86
            - os: windows-latest
              TARGET: x86_64-pc-windows-msvc
              EXTENSION: .exe
              id: build_windows

      # ─── 修正ポイント：ここにあった if 構文を削除 ───

      steps:
        # ★ 改善：ここで最初にチェックボックスを判定し、falseならこのジョブを即座に成功終了（スキップ）させる
        - name: Check if build is enabled
          id: check
          shell: bash
          run: |
            if [ "${{ needs.create-release.outputs[matrix.id] }}" = "true" ]; then
              echo "SHOULD_BUILD=true" >> $GITHUB_OUTPUT
            else
              echo "Skipping this target (not selected in inputs)"
              echo "SHOULD_BUILD=false" >> $GITHUB_OUTPUT
            fi

        # ─── 以降のすべてのステップに if: steps.check.outputs.SHOULD_BUILD == 'true' を付与 ───

        - name: Checkout repository
          if: steps.check.outputs.SHOULD_BUILD == 'true'
          uses: actions/checkout@v4

        - name: Setup Rust toolchain
          if: steps.check.outputs.SHOULD_BUILD == 'true'
          uses: dtolnay/rust-toolchain@stable
          with:
            targets: ${{ matrix.TARGET }}

        - name: Rust Cache
          if: steps.check.outputs.SHOULD_BUILD == 'true'
          uses: Swatinem/rust-cache@v2
          with:
            key: ${{ matrix.TARGET }}

        - name: Install Cross
          if: steps.check.outputs.SHOULD_BUILD == 'true' && contains(matrix.TARGET, 'linux')
          uses: taiki-e/install-action@cross

        - name: Cargo Build
          if: steps.check.outputs.SHOULD_BUILD == 'true'
          run: |
            if [ "${{ contains(matrix.TARGET, 'linux') }}" = "true" ]; then
              cross build --verbose --release --target=${{ matrix.TARGET }}
            else
              cargo build --verbose --release --target=${{ matrix.TARGET }}
            fi
          shell: bash

        - name: Determine archive name
          if: steps.check.outputs.SHOULD_BUILD == 'true'
          shell: bash
          run: |
            version="${{ needs.create-release.outputs.version }}"
            echo "ARCHIVE=task-fighter-$version-${{ matrix.TARGET }}" >> $GITHUB_ENV
            echo "BIN=target/${{ matrix.TARGET }}/release/task-fighter${{ matrix.EXTENSION }}" >> $GITHUB_ENV

        - name: Creating directory for archive
          if: steps.check.outputs.SHOULD_BUILD == 'true'
          shell: bash
          run: |
            mkdir -p "$ARCHIVE"/doc
            cp "$BIN" "$ARCHIVE"/
            cp README.md LICENSE "$ARCHIVE"/ || true
            if [ -d "assets" ]; then cp assets/*.png "$ARCHIVE"/doc/ || true; fi

        - name: Build archive (Windows)
          shell: bash
          if: steps.check.outputs.SHOULD_BUILD == 'true' && startsWith(matrix.os, 'windows')
          run: |
            7z a "$ARCHIVE.zip" "$ARCHIVE"
            certutil -hashfile "$ARCHIVE.zip" SHA256 > "$ARCHIVE.zip.sha256"
            echo "ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
            echo "ASSET_SUM=$ARCHIVE.zip.sha256" >> $GITHUB_ENV

        - name: Build archive (Unix)
          shell: bash
          if: steps.check.outputs.SHOULD_BUILD == 'true' && !startsWith(matrix.os, 'windows')
          run: |
            tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
            shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
            echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
            echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV

        - name: Upload release archive
          if: steps.check.outputs.SHOULD_BUILD == 'true'
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          shell: bash
          run: |
            version="${{ needs.create-release.outputs.version }}"
            gh release upload "$version" ${{ env.ASSET }} ${{ env.ASSET_SUM }} --clobber
