name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      build_macos_arm:
        type: boolean
        description: "Build: aarch64-apple-darwin (macOS ARM)"
        default: false
      build_macos_intel:
        type: boolean
        description: "Build: x86_64-apple-darwin (macOS Intel)"
        default: false
      build_linux_arm:
        type: boolean
        description: "Build: arm-unknown-linux-musleabihf"
        default: false
      build_linux_armv7:
        type: boolean
        description: "Build: armv7-unknown-linux-musleabihf"
        default: false
      build_linux_x86:
        type: boolean
        description: "Build: x86_64-unknown-linux-musl"
        default: false
      build_windows:
        type: boolean
        description: "Build: x86_64-pc-windows-msvc"
        default: false
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            TARGET: aarch64-apple-darwin

          - os: macos-latest
            TARGET: x86_64-apple-darwin

          - os: ubuntu-latest
            TARGET: arm-unknown-linux-musleabihf

          - os: ubuntu-latest
            TARGET: armv7-unknown-linux-musleabihf

          - os: ubuntu-latest
            TARGET: x86_64-unknown-linux-musl

          - os: windows-latest
            TARGET: x86_64-pc-windows-msvc
            EXTENSION: .exe

    steps:
      - name: Building ${{ matrix.TARGET }}
        run: echo "${{ matrix.TARGET }}"

      - uses: actions/checkout@master
      - uses: actions-rs/toolchain@v1.0.1
        with:
          toolchain: stable
          target: ${{ matrix.TARGET }}
          override: true

      - uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --verbose --release --target=${{ matrix.TARGET }}
